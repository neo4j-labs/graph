[workspace]

members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = [
    "Martin Junghanns <github@s1ck.dev>",
    "Paul Horn <developer@knutwalker.de>",
]
rust-version = "1.70"
repository = "https://github.com/neo4j-labs/graph"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ahash = "0.8.12"
arrow = "58.1.0"
arrow-flight = "58.1.0"
async-compression = { version = "0.3.15", features = ["tokio", "stream", "zstd"] }
async-trait = "0.1.89"
atoi = "2.0.0"
atomic = "0.5.3"
atomic_float = "1.1.0"
byte-slice-cast = "1.2.3"
clap = { version = "4.4", features = ["derive"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
dashmap = "6.1.0"
delegate = "0.13.5"
directories = "6.0.0"
env_logger = "0.11.10"
fast-float2 = "0.2.3"
float-ord = "0.3.2"
futures = "0.3.31"
fxhash = "0.2.1"
gdl = "0.2.7"
itertools = "0.14.0"
linereader = "0.4.0"
log = "0.4.29"
memmap2 = "0.9.10"
nanorand = "0.8.0"
num = "0.4.3"
num_cpus = "1.17.0"
num-format = "0.4.4"
numpy = "0.28.0"
page_size = "0.6.0"
parking_lot = "0.12.4"
pico-args = "0.5.0"
polars = { version = "0.53.0", default-features = false, features = ["fmt"] }
pyo3 = "0.28.2"
pyo3-log = "0.13.3"
rand = "0.10.0"
rayon = "1.10.0"
reqwest = { version = "0.13.2", features = ["stream"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
tap = "1.0.1"
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.47.3", features = ["full"], default-features = true }
tokio-tar = "0.3.1"
tokio-util = {version = "0.7.16", features = ["io"] }
tonic = "0.14.5"

[workspace.metadata.release]
pre-release-commit-message = "Release {{crate_name}} {{version}}"
